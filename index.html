<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aarav - Live Voice Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen p-4 font-sans antialiased">

  <div class="max-w-md w-full bg-slate-900 border border-amber-500/30 rounded-3xl p-6 text-center space-y-4 shadow-2xl relative overflow-hidden">
    
    <!-- Pulse Ring Animation -->
    <div id="mic-pulse" class="w-20 h-20 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center mx-auto text-3xl transition-all duration-300">
      <i data-lucide="mic" class="w-8 h-8"></i>
    </div>
    
    <div>
      <h2 class="text-xl font-extrabold text-white">Aarav — AI Voice Concierge</h2>
      <p id="status-text" class="text-xs text-slate-400 mt-1">Tap below to talk about the menu or reserve a table</p>
    </div>

    <!-- Live Conversation Transcript Box -->
    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-left min-h-[140px] max-h-[220px] overflow-y-auto text-xs space-y-2.5">
      <p id="user-said" class="text-slate-400"><strong>You:</strong> <i>Tap 'Start Call' and speak...</i></p>
      <p id="ai-reply" class="text-amber-400"><strong>Aarav:</strong> <i>Hello! I am Aarav from Spice Garden. How may I assist you with our menu or reservations today?</i></p>
    </div>

    <!-- Live Booking Notification -->
    <div id="booking-alert" class="hidden p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">
      🎉 Booking saved to your Google Sheet!
    </div>

    <!-- Action Button -->
    <button id="talk-btn" onclick="toggleCall()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black text-xs py-3.5 rounded-2xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2">
      <i data-lucide="phone-call" class="w-4 h-4"></i> <span id="btn-label">Start Call</span>
    </button>
  </div>

  <script>
    lucide.createIcons();

    // 1. CONFIGURATION
    const GEMINI_API_KEY = "AQ.Ab8RN6KZYW56M3d6gP5-aG0YbSmabakfWtXoxO0Q-Z_Q7gvlWQ"; // Get your free key at https://aistudio.google.com
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzaNy4wDQ-Ek0oy6hLLLdQmNP4EI6oLIpdTakJ9Y6Rm8-nfnTSnFJkLBSO6SecXNyubBQ/exec";

    const SYSTEM_PROMPT = `
You are "Aarav", a polite and professional AI voice receptionist for "Spice Garden Restaurant" in Indiranagar, Bengaluru.
- Timings: 12:00 PM to 11:30 PM daily.
- Signature Dishes: Chettinad Chicken Biryani (₹380), Paneer Butter Masala (₹320), Japanese Ramen (₹420), Chocolate Lava Cake (₹220).
- Facilities: Free Valet Parking, Halal meat, Pure-Veg section, Jain options.
- Style: Keep responses very concise (1-2 sentences max) so it sounds natural when spoken aloud.

RESERVATION INSTRUCTIONS:
When the user wants to book a table, collect their Name, Date, Time, and Number of Guests.
Once all 4 details are provided by the user, you MUST include a hidden JSON block at the very end of your response formatted EXACTLY like this:
BOOKING_DATA:{"name":"<Customer Name>","phone":"+91 9999999999","date":"<Date>","time":"<Time>","guests":<Guest Count>}
`;

    let conversationHistory = [
      { role: "user", parts: [{ text: SYSTEM_PROMPT }] },
      { role: "model", parts: [{ text: "Understood. I am ready to act as Aarav the restaurant voice concierge." }] }
    ];

    let recognition;
    let isCalling = false;

    // 2. BROWSER SPEECH-TO-TEXT (STT)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-IN';

      recognition.onstart = () => {
        document.getElementById('status-text').innerText = "Listening... Speak now!";
        document.getElementById('mic-pulse').classList.add('animate-ping');
      };

      recognition.onresult = async (event) => {
        document.getElementById('mic-pulse').classList.remove('animate-ping');
        const userText = event.results[0][0].transcript;
        document.getElementById('user-said').innerHTML = `<strong>You:</strong> ${userText}`;
        document.getElementById('status-text').innerText = "Aarav is thinking...";

        // Process with Gemini
        await processWithGemini(userText);
      };

      recognition.onerror = (e) => {
        console.error(e);
        document.getElementById('status-text').innerText = "Tap 'Start Call' to try speaking again";
        document.getElementById('mic-pulse').classList.remove('animate-ping');
      };
    } else {
      alert("Please use Google Chrome, Safari, or Edge for Web Speech support.");
    }

    function toggleCall() {
      if (!isCalling) {
        isCalling = true;
        document.getElementById('btn-label').innerText = "End Call";
        document.getElementById('talk-btn').className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-black text-xs py-3.5 rounded-2xl transition-all flex items-center justify-center gap-2";
        recognition.start();
      } else {
        isCalling = false;
        window.speechSynthesis.cancel();
        document.getElementById('btn-label').innerText = "Start Call";
        document.getElementById('talk-btn').className = "w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black text-xs py-3.5 rounded-2xl transition-all flex items-center justify-center gap-2";
        document.getElementById('status-text').innerText = "Call ended. Tap to start again.";
      }
    }

    // 3. GEMINI API CALL & AUTO-BOOKING DETECTION
    async function processWithGemini(userMessage) {
      conversationHistory.push({ role: "user", parts: [{ text: userMessage }] });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: conversationHistory })
        });
        const data = await response.json();
        let aiRawReply = data.candidates[0].content.parts[0].text;

        // Check if Gemini detected a complete booking
        if (aiRawReply.includes("BOOKING_DATA:")) {
          const parts = aiRawReply.split("BOOKING_DATA:");
          const spokenReply = parts[0].trim();
          const bookingJson = JSON.parse(parts[1].trim());

          displayAndSpeak(spokenReply);
          saveBookingToGoogleSheet(bookingJson);
          conversationHistory.push({ role: "model", parts: [{ text: spokenReply }] });
        } else {
          displayAndSpeak(aiRawReply);
          conversationHistory.push({ role: "model", parts: [{ text: aiRawReply }] });
        }
      } catch (err) {
        console.error(err);
        displayAndSpeak("I'm sorry, I had trouble connecting. Could you please repeat that?");
      }
    }

    // 4. TEXT-TO-SPEECH (TTS)
    function displayAndSpeak(cleanText) {
      document.getElementById('ai-reply').innerHTML = `<strong>Aarav:</strong> ${cleanText}`;
      
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.0;
      
      const voices = window.speechSynthesis.getVoices();
      const indianVoice = voices.find(v => v.lang.includes('en-IN') || v.lang.includes('en-US'));
      if (indianVoice) utterance.voice = indianVoice;

      utterance.onend = () => {
        if (isCalling) {
          document.getElementById('status-text').innerText = "Listening for your reply...";
          recognition.start(); // Keep the conversation flowing
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    // 5. POST TO YOUR GOOGLE APPS SCRIPT URL
    async function saveBookingToGoogleSheet(booking) {
      document.getElementById('booking-alert').classList.remove('hidden');
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            customer_name: booking.name,
            phone_number: booking.phone || "+91 9999999999",
            date: booking.date,
            time: booking.time,
            guests: booking.guests
          })
        });
      } catch (e) {
        console.error("Sheet error:", e);
      }
    }
  </script>
</body>
</html>
